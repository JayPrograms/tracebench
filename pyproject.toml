[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracebench"
version = "0.1.0"
description = "Local-first regression testing for LLM applications"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.6,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "types-PyYAML>=6,<7",
]
dashboard = [
    "streamlit>=1.40,<2",
]

[project.scripts]
tracebench = "tracebench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebench"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

