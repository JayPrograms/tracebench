name: Evaluation gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints-ci.txt
      - name: Install TraceBench and development dependencies
        run: python -m pip install -e ".[dev]" -c .github/constraints-ci.txt
      - name: Build fresh customer-support evaluation database
        env:
          TRACEBENCH_DB_PATH: ${{ runner.temp }}/northstar-support-ci.sqlite3
        run: python scripts/bootstrap_customer_support_demo.py --database "$TRACEBENCH_DB_PATH"
      - name: Run passing release gate
        env:
          TRACEBENCH_DB_PATH: ${{ runner.temp }}/northstar-support-ci.sqlite3
        run: tracebench experiment run demos/customer-support/experiment.ci-pass.yaml --json > "$RUNNER_TEMP/northstar-support-ci-report.json"
      - name: Verify passing verdict
        env:
          REPORT_PATH: ${{ runner.temp }}/northstar-support-ci-report.json
        run: python -c "import json, os; report=json.load(open(os.environ['REPORT_PATH'], encoding='utf-8')); assert report['verdict'] == 'PASS'; assert report['status'] == 'completed'"
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-support-ci-report
          path: ${{ runner.temp }}/northstar-support-ci-report.json
          if-no-files-found: error
