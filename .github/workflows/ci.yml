name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints-ci.txt
      - name: Install TraceBench and development dependencies
        run: python -m pip install -e ".[dev,dashboard]" -c .github/constraints-ci.txt
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy src
      - name: Run tests
        run: pytest
