schema_version: 1
name: northstar-support-ci-pass
dataset: northstar-support-eval:1.0
baseline:
  provider: fixture
  path: baseline.jsonl
candidate:
  provider: fixture
  path: candidate.ci-pass.jsonl
judge:
  provider: fixture
  path: judge.ci-pass.jsonl
  prompt_version: rubric-v1
  prompt_file: ../../prompts/judges/rubric-v1.txt
  retry_prompt_file: ../../prompts/judges/rubric-retry-v1.txt
  confidence_threshold: 0.7
gate:
  max_score_drop: 0.02
  max_new_failures: 2
  by_mode:
    reference:
      max_score_drop: 0.0
      max_new_failures: 0
    deterministic:
      max_score_drop: 0.0
      max_new_failures: 0
    rubric:
      max_score_drop: 0.05
      max_new_failures: 1
  by_slice:
    refund-policy:
      max_score_drop: 0.0
      max_new_failures: 0
    account-security:
      max_score_drop: 0.0
      max_new_failures: 0
